services:
  telegram-file-code-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-file-code-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WEB_HOST: 0.0.0.0
      WEB_PORT: ${WEB_PORT:-8080}
    ports:
      - "${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    volumes:
      - ./data:/app/data
